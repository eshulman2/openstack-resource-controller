---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSRecordset
metadata:
  name: dnsrecordset-create-full
status:
  resource:
    name: sample-record.create-full.example.com.
    type: A
    records:
    - 1.2.3.4
    ttl: 3600
    description: DNSRecordset from "create full" test
    status: ACTIVE
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSRecordset
      name: dnsrecordset-create-full
      ref: dnsrecordset
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: dnsrecordset-create-full
      ref: dNSZone
assertAll:
    - celExpr: "dnsrecordset.status.id != ''"
    - celExpr: "dnsrecordset.status.resource.ttl == 3600"
    - celExpr: "dnsrecordset.status.resource.status == 'ACTIVE'"
