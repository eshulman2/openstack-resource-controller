---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSRecordset
      name: dnsrecordset-update
      ref: dnsrecordset
assertAll:
    - celExpr: "!has(dnsrecordset.status.resource.description)"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSRecordset
metadata:
  name: dnsrecordset-update
status:
  resource:
    name: record.update.example.com.
    type: A
    records:
    - 1.2.3.4
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
