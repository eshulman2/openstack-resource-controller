---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSRecordset
      name: dnsrecordset-import-dependency
      ref: dnsrecordset1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSRecordset
      name: dnsrecordset-import-dependency-not-this-one
      ref: dnsrecordset2
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: dnsrecordset-import-dependency
      ref: dNSZone
assertAll:
    - celExpr: "dnsrecordset1.status.id != dnsrecordset2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSRecordset
metadata:
  name: dnsrecordset-import-dependency
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
