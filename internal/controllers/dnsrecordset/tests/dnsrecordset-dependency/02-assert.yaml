---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSZone
      name: dnsrecordset-dependency
      ref: dNSZone
    - apiVersion: v1
      kind: Secret
      name: dnsrecordset-dependency
      ref: secret
assertAll:
    - celExpr: "dNSZone.metadata.deletionTimestamp != 0"
    - celExpr: "'openstack.k-orc.cloud/dnsrecordset' in dNSZone.metadata.finalizers"
    - celExpr: "secret.metadata.deletionTimestamp != 0"
    - celExpr: "'openstack.k-orc.cloud/dnsrecordset' in secret.metadata.finalizers"
