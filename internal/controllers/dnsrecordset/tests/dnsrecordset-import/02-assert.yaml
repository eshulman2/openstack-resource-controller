---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSRecordset
      name: dnsrecordset-import-external
      ref: dnsrecordset1
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: DNSRecordset
      name: dnsrecordset-import-external-not-this-one
      ref: dnsrecordset2
assertAll:
    - celExpr: "dnsrecordset1.status.id != dnsrecordset2.status.id"
---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: DNSRecordset
metadata:
  name: dnsrecordset-import
status:
  conditions:
    - type: Available
      message: OpenStack resource is available
      status: "True"
      reason: Success
    - type: Progressing
      message: OpenStack resource is up to date
      status: "False"
      reason: Success
  resource:
    name: dnsrecordset-import-external.import.example.com.
    type: A
    records:
    - 1.2.3.4
    description: DNSRecordset dnsrecordset-import-external from "dnsrecordset-import" test
